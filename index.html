<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дата по Москве</title>
</head>
<body>
  <span id="date">--.--</span>
  <script>
    const dateElement = document.getElementById('date');

    let moscowTimeAtSync = null;
    let monotonicTimeAtSync = null;

    function showDate() {
      if (moscowTimeAtSync === null) return;

      // performance.now() не зависит от изменения системных часов.
      const elapsed = performance.now() - monotonicTimeAtSync;
      const currentMoscowTime = new Date(moscowTimeAtSync + elapsed);

      const day = String(currentMoscowTime.getUTCDate()).padStart(2, '0');
      const month = String(currentMoscowTime.getUTCMonth() + 1).padStart(2, '0');
      dateElement.textContent = day + '.' + month;
    }

    async function syncMoscowTime() {
      try {
        const response = await fetch(
          'https://timeapi.io/api/Time/current/zone?timeZone=Europe%2FMoscow',
          { cache: 'no-store' }
        );
        if (!response.ok) throw new Error('Time service unavailable');

        const data = await response.json();

        // API отдаёт компоненты времени уже в часовом поясе Москвы.
        // Собираем их как UTC-компоненты, чтобы не зависеть от зоны устройства.
        moscowTimeAtSync = Date.UTC(
          data.year, data.month - 1, data.day,
          data.hour, data.minute, data.seconds,
          data.milliSeconds || 0
        );
        monotonicTimeAtSync = performance.now();
        showDate();
      } catch (error) {
        // Не подменяем время локальными часами: ждём успешной синхронизации.
        if (moscowTimeAtSync === null) dateElement.textContent = '--.--';
      }
    }

    syncMoscowTime();
    setInterval(showDate, 1000);
    setInterval(syncMoscowTime, 10 * 60 * 1000);
  </script>
</body>
</html>
